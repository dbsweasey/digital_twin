services:
  - type: web
    name: digital-twin
    runtime: python
    plan: starter
    buildCommand: pip install uv && uv sync --frozen
    startCommand: cd app && uv run --project .. uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PUSHOVER_USER
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
